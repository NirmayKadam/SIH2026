[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "criminal-network-analysis"
version = "0.1.0"
description = "AI-Powered Criminal Network Analysis System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "neo4j==5.24.0",
    "redis==5.0.8",
    "rq==1.16.2",
    "rapidfuzz==3.9.7",
    "networkx==3.3",
    "google-generativeai==0.8.2",
    "python-dotenv==1.0.1",
    "pytest==8.3.3",
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11.4",
    "slowapi>=0.1.9",
    "nh3>=0.2.17",
]

[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tests"]
